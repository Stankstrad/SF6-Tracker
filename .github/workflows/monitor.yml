name: SF6 monitor
on:
  schedule:
    - cron: "*/5 * * * *"      # toutes les 5 minutes (minimum GitHub)
  workflow_dispatch:            # lancement manuel possible
permissions:
  contents: write
concurrency:
  group: sf6-monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les matchs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUCKLER_COOKIE: ${{ secrets.BUCKLER_COOKIE }}
        run: python monitor.py
      - name: Enregistrer l'historique
        run: |
          git config user.name "sf6-bot"
          git config user.email "sf6-bot@users.noreply.github.com"
          git add history.json seen.json
          git diff --cached --quiet || (git commit -m "maj historique" && git push)
