name: SF6 monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rattraper tout l'historique disponible (100 derniers matchs par joueur)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sf6-monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identité git
        run: |
          git config user.name "sf6-bot"
          git config user.email "sf6-bot@users.noreply.github.com"
      - name: Vérifier les matchs (plusieurs passages par exécution)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUCKLER_COOKIE: ${{ secrets.BUCKLER_COOKIE }}
          LOOP_SECONDS: "270"
          POLL_SECONDS: "45"
          GIT_PUSH: "1"
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
        run: python monitor.py
      - name: Enregistrer l'historique (filet de sécurité)
        if: always()
        run: |
          git add -A data
          git diff --cached --quiet || (git commit -m "maj données" && git pull --rebase -q && git push)
