<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SF6 Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">SF6</span><span id="site-title">Tracker</span></div>
    <nav id="players" class="players" aria-label="Joueurs"></nav>
    <div class="updated" id="updated"></div>
  </header>

  <main>
    <section id="profile" class="profile"></section>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="progress" class="active">Progression</button>
      <button role="tab" data-tab="history">Historique</button>
      <button role="tab" data-tab="rivals">Rivaux</button>
    </div>

    <!-- Progression -->
    <section id="tab-progress" class="panel">
      <div class="controls">
        <label>Personnage <select id="pg-char"></select></label>
        <label>Début <input type="date" id="pg-start"></label>
        <label>Fin <input type="date" id="pg-end"></label>
        <div class="seg" id="pg-quick">
          <button data-days="1">24 h</button>
          <button data-days="7">7 j</button>
          <button data-days="30">30 j</button>
          <button data-days="0">Tout</button>
        </div>
      </div>
      <div class="chart-wrap"><svg id="chart" role="img" aria-label="Évolution"></svg><div id="tip" class="tip" hidden></div>
        <div class="legend"><span><i style="background:var(--win)"></i>Victoire</span><span><i style="background:var(--loss)"></i>Défaite</span><span><i class="ring"></i>Contre un rival</span><span class="muted">Valeur avant chaque match ; dernier point = valeur actuelle</span></div></div>
      <div class="stats-row" id="pg-stats"></div>
    </section>

    <!-- Historique -->
    <section id="tab-history" class="panel" hidden>
      <div class="controls">
        <label>Personnage <select id="hi-char"></select></label>
        <label>Mode <select id="hi-mode">
          <option value="">Tous</option><option>Ranked</option><option>Casual</option><option>Room</option><option>Hub</option>
        </select></label>
        <label>Adversaire <input type="search" id="hi-search" placeholder="Pseudo…"></label>
        <label class="check"><input type="checkbox" id="hi-rivals"> Rivaux seulement</label>
      </div>
      <div class="table-wrap">
        <table class="matches">
          <thead><tr><th>Date</th><th>Rés.</th><th>Perso</th><th>Adversaire</th><th>Score</th><th>Mode</th><th class="num">MR</th></tr></thead>
          <tbody id="hi-body"></tbody>
        </table>
      </div>
      <button id="hi-more" class="more" hidden>Afficher plus</button>
    </section>

    <!-- Rivaux -->
    <section id="tab-rivals" class="panel" hidden>
      <div class="controls">
        <label class="grow">Ajouter un adversaire (sur ce navigateur)
          <input list="opp-list" id="rv-add" placeholder="Pseudo ou ID CFN d'un adversaire déjà affronté">
          <datalist id="opp-list"></datalist>
        </label>
        <a id="rv-edit" class="link" target="_blank" rel="noopener" hidden>Modifier les rivaux du serveur ↗</a>
      </div>
      <div id="rv-grid" class="rv-grid"></div>
      <div id="rv-detail"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
